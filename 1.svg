  <path d="M312 46 Q305 32 318 36 Q316 26 328 34" stroke="#ffd166" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Beak & pouch -->
  <path d="M338 60 L455 72 L340 76 Z" fill="url(#beak)" stroke="#c86b00" stroke-width="1.5"/>
  <path d="M340 76 L452 74 Q420 118 370 108 Q345 100 340 76 Z" fill="#ffcf70" stroke="#c86b00" stroke-width="1.5"/>
  <path d="M452 72 L462 78 L450 77 Z" fill="#c86b00"/>

  <!-- Eye -->
  <circle cx="328" cy="60" r="5.5" fill="#fff" stroke="#333" stroke-width="1"/>
  <circle cx="329.5" cy="60" r="3" fill="#111"/>
  <circle cx="330.5" cy="58.8" r="1" fill="#fff"/>

  <!-- Motion lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="60" y1="250" x2="100" y2="250"/>
    <line x1="40" y1="290" x2="95" y2="290"/>
    <line x1="70" y1="330" x2="105" y2="330"/>
