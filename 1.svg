  <path d="M200 190 L160 175 L172 195 L158 205 L205 205 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>

  <!-- Body & wing -->
  <ellipse cx="250" cy="180" rx="62" ry="42" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/>
  <path d="M215 165 Q265 140 300 175 Q280 205 225 200 Q205 190 215 165 Z" fill="#dee2e6" stroke="#868e96" stroke-width="2"/>
  <path d="M230 185 Q255 192 285 182" stroke="#868e96" stroke-width="1.5" fill="none"/>
  <path d="M235 175 Q258 180 288 172" stroke="#868e96" stroke-width="1.5" fill="none"/>
  <path d="M290 172 Q335 165 372 190" stroke="#dee2e6" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M290 172 Q335 165 372 190" stroke="#868e96" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>

  <!-- Neck & head -->
  <path d="M285 160 Q310 120 300 90 Q296 72 315 65" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M296 155 Q318 120 309 92" stroke="#e9ecef" stroke-width="3" fill="none"/>
