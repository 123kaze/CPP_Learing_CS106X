    <ellipse cx="145" cy="60" rx="30" ry="14"/>
    <ellipse cx="330" cy="100" rx="40" ry="13"/>
  </g>
  <rect y="370" width="600" height="80" fill="#7cc66b"/>
  <rect y="380" width="600" height="18" fill="#9a9a9a"/>
  <g stroke="#fff" stroke-width="3" stroke-dasharray="20 18">
    <line x1="0" y1="389" x2="600" y2="389"/>
  </g>

  <!-- Bicycle -->
  <g stroke="#2b2d42" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="320" r="58"/>
    <circle cx="420" cy="320" r="58"/>
    <g stroke-width="1.5" stroke="#555">
      <line x1="170" y1="262" x2="170" y2="378"/>
      <line x1="112" y1="320" x2="228" y2="320"/>
      <line x1="129" y1="279" x2="211" y2="361"/>
      <line x1="129" y1="361" x2="211" y2="279"/>
      <line x1="420" y1="262" x2="420" y2="378"/>
      <line x1="362" y1="320" x2="478" y2="320"/>
      <line x1="379" y1="279" x2="461" y2="361"/>
      <line x1="379" y1="361" x2="461" y2="279"/>
    </g>
    <g stroke="#e63946">
      <line x1="170" y1="320" x2="280" y2="320"/>
      <line x1="170" y1="320" x2="250" y2="225"/>
      <line x1="280" y1="320" x2="250" y2="225"/>
      <line x1="250" y1="225" x2="385" y2="225"/>
      <line x1="280" y1="320" x2="385" y2="225"/>
      <line x1="385" y1="225" x2="420" y2="320"/>
      <line x1="385" y1="225" x2="378" y2="195"/>
    </g>
    <path d="M365 192 L392 192 Q402 192 400 204"/>
    <line x1="250" y1="225" x2="246" y2="208"/>
    <path d="M225 205 L265 205" stroke-width="8"/>
    <circle cx="280" cy="320" r="12" stroke-width="4"/>
    <line x1="280" y1="320" x2="300" y2="345" stroke-width="4"/>
    <line x1="280" y1="320" x2="262" y2="296" stroke-width="4"/>
    <line x1="292" y1="345" x2="310" y2="345" stroke-width="6"/>
    <line x1="254" y1="296" x2="272" y2="296" stroke-width="6"/>
  </g>
  <circle cx="170" cy="320" r="5" fill="#2b2d42"/>
  <circle cx="420" cy="320" r="5" fill="#2b2d42"/>

  <!-- Pelican legs -->
  <g stroke="#f4a259" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M250 215 L285 255 L300 343"/>
    <path d="M240 215 L250 260 L262 296"/>
